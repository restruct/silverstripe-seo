---
Name: restruct-seo
After:
  - '#cmsextensions'
---
# Page fields and head output (meta title, description fallback, robots, canonical, Open Graph).
SilverStripe\CMS\Model\SiteTree:
  extensions:
    seo: Restruct\Silverstripe\SEO\Extensions\SeoSiteTreeExtension

# Response headers (X-Robots-Tag, Link rel=canonical) are set on the controller's response object, so they also
# reach code that renders a page in-process and reads the headers back (the page checks of a later version).
SilverStripe\CMS\Controllers\ContentController:
  extensions:
    seo: Restruct\Silverstripe\SEO\Extensions\SeoContentControllerExtension

# Site-wide defaults: fallback sharing image and the title suffix.
SilverStripe\SiteConfig\SiteConfig:
  extensions:
    seo: Restruct\Silverstripe\SEO\Extensions\SeoSiteConfigExtension
    # The site's Organization node in structured data, mapped from SiteConfig, with one fixed @id
    # (<base URL>/#organization) every other node can point at with { ref: organization }
    seo-schema: Restruct\Silverstripe\SEO\Extensions\SchemaSource
  schema_type: Organization
  schema_id: organization
  # Only core SiteConfig fields and the module's own. A project adds its own (more sameAs fields, say) or maps a
  # property to its own field in its YAML, or sets a property to null to drop it; a LocalBusiness sets schema_type
  schema_map:
    name: Title
    url: SeoSchemaSiteURL
    logo: SeoLogo
    sameAs: SeoSchemaSameAs
    # The contact details on Settings > SEO (SeoSiteConfigExtension)
    description: SeoOrgDescription
    email: SeoOrgEmail
    telephone: SeoOrgTelephone
    address:
      '@type': PostalAddress
      # A postcode or a country alone locates nothing: only output with a street or a place
      '@required': ['streetAddress | addressLocality']
      streetAddress: SeoOrgStreet
      postalCode: SeoOrgPostalCode
      addressLocality: SeoOrgLocality
      addressRegion: SeoOrgRegion
      addressCountry: SeoOrgCountry
