en:
  Restruct\Silverstripe\SEO\Extensions\SeoSiteTreeExtension:
    CanonicalHelp: 'Only when this page duplicates another one: the URL of the original (https://... or a path starting with /). Leave empty and the page points to itself.'
    CanonicalInvalid: 'The canonical URL must start with https://, http:// or /.'
    CanonicalURL: 'Canonical URL'
    MetaRobotsNoCache: 'No cached copy in search engines (noarchive)'
    MetaRobotsNoFollow: 'Do not follow the links on this page (nofollow)'
    MetaRobotsNoIndex: 'Hide from search results (noindex)'
    MetaRobotsNoSnippet: 'No text snippet in search results (nosnippet)'
    MetaTitle: 'Meta title'
    MetaTitleHelp: 'Shown as the link text in search results. Leave empty to use the page title. The site name is added automatically.'
    NoIndexHelp: 'The page stays reachable, but asks search engines not to list it. It is also left out of the sitemap.'
    OGDescriptionHelp: 'Leave empty to use the meta description.'
    OGImage: 'Sharing image'
    OGImageHelp: 'Shown when the page is shared on social media or in chat apps. Best at 1200 x 630 pixels. Leave empty to use the site default.'
    RobotsHeader: 'Search engine indexing'
    SchemaHeader: 'Structured data'
    SchemaPreviewFailed: 'The structured data could not be built: {message}'
    SchemaPreviewHelp: 'What search engines get from this page as structured data, after the last save. Built from the page and the records it shows; nodes that miss required information are left out.'
    SEOFBdescription: 'Sharing description'
    SharingHeader: 'Social media and sharing'
    ToggleTitle: 'Search engines and sharing'
  Restruct\Silverstripe\SEO\Extensions\SeoSiteConfigExtension:
    SeoDefaultImage: 'Default sharing image'
    SeoDefaultImageHelp: 'Used when a page that is shared has no sharing image of its own. Best at 1200 x 630 pixels.'
    SeoLogo: 'Logo'
    SeoLogoHelp: 'The organisation''s logo for search engines. At least 112 x 112 pixels, legible on a white background.'
    SeoSameAs: 'Profiles on other sites'
    SeoSameAsHelp: 'The organisation''s pages on other sites (social media, a business register), one URL per line.'
    SeoTitleSuffix: 'Title suffix'
    SeoTitleSuffixHelp: 'Added after every page title in search results, e.g. "About us | Your Site". Leave empty to use the site title.'
    TabTitle: 'SEO'
  Restruct\Silverstripe\SEO\Schema\PageSchema:
    MissingRecommended: '{type} lacks {property}, which is recommended.'
    MissingRequired: '{type} lacks {property}, which is required: it is not output.'
